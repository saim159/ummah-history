  src:"Main sources: Ibn Ishaq–Ibn Hisham, al-Waqidi (Kitab al-Maghazi), Ibn Sa'd, al-Tabari, Ibn Kathir, Sahih al-Bukhari (Kitab al-Maghazi); modern: Watt (Muhammad at Medina), Encyclopaedia of Islam (2nd ed.). Detailed footnotes appear in each article."}
};

function rows(){
 const u=UI[lang],q=qry.trim().toLowerCase();
 return D.map((d,i)=>({d,i})).filter(({d})=>(flt==="all"||d[0]===flt)&&(!q||(d[2].bn+d[2].en+d[3].bn+d[3].en).toLowerCase().includes(q)));
}
function fill(){
 const u=UI[lang],r=rows();
 $("#tb").innerHTML=r.map(({d,i})=>`<tr><td>${num(i+1)}</td><td><b>${L(d[2])}</b></td><td>${num(d[1])}<br><small style="color:var(--mute)">${CE[d[1]]?(lang==="bn"?bnum(CE[d[1]]):CE[d[1]]):""} ${lang==="bn"?"খ্রি.":"CE"}</small></td><td><span class="ty ${d[0]}">${d[0]==="g"?u.g:u.s}</span></td><td>${L(d[3])}</td><td>${L(d[4])}</td><td>${d[7]?`<a class="lk" href="${d[7]}">${u.art}</a>`:`<span style="color:var(--mute);font-size:.8rem">${u.soon}</span>`}</td></tr>`).join("");
 $("#cnt").textContent=u.cnt(r.length,D.length);
}
function render(){
 const u=UI[lang];document.body.dataset.lang=lang;document.documentElement.lang=lang;
 const sec=[["over",u.s_over],["list",u.s_list],["map",u.s_map],["note",u.s_note],["src",u.s_src]];
 $("#app").innerHTML=`
 <header><div class="nav"><a class="logo" href="index.html">☪ Ummah Chronicles</a>
  <a class="l" href="index.html">${u.home}</a><a class="l" href="seerah.html">${lang==="bn"?"সীরাত":"Seerah"}</a>
  <div class="tools"><select id="lang"><option value="bn">বাংলা</option><option value="en">English</option></select>
  <button class="t" id="dark">🌙</button><button class="t" id="fminus">A−</button><button class="t" id="fplus">A+</button></div></div></header>
 <div class="hero"><div class="in"><div class="crumb"><a href="index.html">${u.home}</a> › <a href="seerah.html">${lang==="bn"?"সীরাত":"Seerah"}</a> › ${u.b2}</div>
  <div class="ar">${u.ar}</div><h1>${u.h1}</h1><p>${u.sub}</p>
  <div class="badges"><span class="bdg">${u.b1}</span><span class="bdg">${u.b2}</span></div></div></div>
 <div class="wrap"><article>
  <h2 id="over">${u.s_over}</h2>${u.over.map(p=>`<p>${p}</p>`).join("")}
  <h2 id="list">${u.s_list}</h2>
  <div class="ctl"><input id="q" type="search" placeholder="${u.q}" value="${qry.replace(/"/g,"&quot;")}">
   ${["all","g","s"].map(k=>`<button class="chip ${flt===k?"on":""}" data-f="${k}">${u[k]}</button>`).join("")}</div>
  <div class="cnt" id="cnt"></div>
  <div class="tw"><table class="mg"><thead><tr>${u.th.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody id="tb"></tbody></table></div>
  <h2 id="map">${u.s_map}</h2><div id="map"></div><div class="cap">${u.mapcap}</div>
  <h2 id="note">${u.s_note}</h2>${u.notes.map(n=>`<div class="var">${n}</div>`).join("")}
  <h2 id="src">${u.s_src}</h2><div class="note">${u.src}</div>
 </article></div>
 <footer>© 2026 Ummah Chronicles</footer>`;
 $("#lang").value=lang;
 $("#lang").onchange=e=>{lang=e.target.value;store.set("lang",lang);render()};
 $("#dark").onclick=()=>{const d=document.documentElement,on=d.dataset.theme==="dark";d.dataset.theme=on?"":"dark";store.set("theme",on?"":"dark")};
 let fs=parseInt(getComputedStyle(document.documentElement).getPropertyValue("--fs"))||17;
 $("#fplus").onclick=()=>{fs=Math.min(24,fs+1);document.documentElement.style.setProperty("--fs",fs+"px")};
 $("#fminus").onclick=()=>{fs=Math.max(13,fs-1);document.documentElement.style.setProperty("--fs",fs+"px")};
 $("#q").oninput=e=>{qry=e.target.value;fill()};
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{flt=b.dataset.f;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));fill()});
 fill();
 const LF=window.L;
 if(LF&&LF.map){try{
  const m=LF.map("map",{scrollWheelZoom:false}).setView([25.5,38.5],5);
  LF.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap contributors"}).addTo(m);
  const by={};
  D.forEach(d=>{if(d[5]==null)return;const k=d[5]+","+d[6];(by[k]=by[k]||{lat:d[5],lng:d[6],items:[]}).items.push(d)});
  Object.values(by).forEach(g=>LF.marker([g.lat,g.lng]).addTo(m).bindPopup(g.items.map(d=>`<b>${L(d[2])}</b> (${num(d[1])} ${lang==="bn"?"হি.":"AH"})`).join("<br>")));
 }catch(e){}}
 else $("#map").innerHTML='<div style="padding:30px;color:var(--mute)">Map could not load (Leaflet).</div>';
}
window.addEventListener("scroll",()=>{const h=document.documentElement;$("#prog").style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight||1)*100)+"%"});
render();
</script>
</body>
</html>
