<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ummah Chronicles — মুসলিম উম্মাহর ইতিহাস</title>
<meta name="description" content="A research-oriented digital archive of Muslim history in English and Bengali.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Serif+Bengali:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ec;--bg2:#f1e9d6;--ink:#1d2a2a;--mute:#5b6a68;--gold:#b8892b;--green:#0f5a4a;--card:#fffdf6;--line:#e2d6b8;--fs:17px}
[data-theme="dark"]{--bg:#0d1716;--bg2:#13221f;--ink:#ece6d3;--mute:#9fb0ab;--gold:#d9a93f;--green:#3fb79a;--card:#162826;--line:#27403b}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:var(--fs)}
body{background:var(--bg);color:var(--ink);font-family:'Inter','Noto Serif Bengali',serif;line-height:1.7;transition:background .3s}
body[data-lang="bn"]{font-family:'Noto Serif Bengali','Inter',serif}
a{color:var(--green)}
header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{max-width:1200px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.logo{font-family:'Amiri',serif;font-size:1.5rem;font-weight:700;color:var(--gold);margin-right:auto;text-decoration:none}
.nav a.l{color:var(--ink);text-decoration:none;font-size:.9rem}
.nav a.l:hover{color:var(--gold)}
.tools{display:flex;gap:8px;align-items:center}
select,button.t{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit;font-size:.85rem}
.hero{position:relative;min-height:88vh;display:grid;place-items:center;text-align:center;padding:60px 20px;overflow:hidden;background:linear-gradient(180deg,rgba(6,21,19,.62),rgba(8,36,31,.82)),url("https://commons.wikimedia.org/wiki/Special:FilePath/Cordoba%2C_la_Mezquita_-_Mihrab.jpg?width=1800") center/cover no-repeat,radial-gradient(circle at 50% 30%,#14584a 0,#0a2a25 55%,#061513 100%);color:#f3ead0}
.imgcredit{position:absolute;bottom:62px;right:14px;font-size:.7rem;opacity:.75;z-index:2}
.imgcredit a{color:#e6bf6a}
.sch{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 22px}
.sch a{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--ink);font-size:.9rem}
.sch a:hover{box-shadow:0 6px 18px rgba(0,0,0,.12)}
.hero svg.pattern{position:absolute;inset:0;width:100%;height:100%;opacity:.12}
.hero .in{position:relative;max-width:820px}
.bismi{font-family:'Amiri',serif;font-size:2rem;color:#e6bf6a;margin-bottom:10px}
.hero h1{font-family:'Amiri','Noto Serif Bengali',serif;font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.2;margin-bottom:16px}
.hero p{font-size:1.1rem;opacity:.9;margin-bottom:28px}
.btn{display:inline-block;padding:12px 26px;border-radius:30px;background:var(--gold);color:#1a1405;text-decoration:none;font-weight:600;margin:5px}
.btn.o{background:transparent;border:1.5px solid #e6bf6a;color:#e6bf6a}
.search{margin:0 auto 26px;max-width:480px}
.search input{width:100%;padding:13px 20px;border-radius:30px;border:none;font:inherit;font-size:.95rem}
section{max-width:1200px;margin:auto;padding:70px 20px}
h2{font-family:'Amiri','Noto Serif Bengali',serif;font-size:2.1rem;color:var(--green);margin-bottom:8px}
.sub{color:var(--mute);margin-bottom:30px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-top:-50px;position:relative;z-index:5;max-width:1200px;margin-inline:auto;padding:0 20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.stat b{display:block;font-size:2.1rem;color:var(--gold);font-family:'Amiri',serif}
.rail{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 18px}
.rail button{flex:1 0 auto;min-width:120px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:inherit;font-size:.85rem;border-top:4px solid var(--c)}
.rail button.on{background:var(--c);color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;min-height:190px}
.panel h3{font-family:'Amiri','Noto Serif Bengali',serif;font-size:1.6rem;color:var(--gold)}
.panel .meta{color:var(--mute);font-size:.88rem;margin:4px 0 12px}
.tag{display:inline-block;background:var(--bg2);border-radius:20px;padding:2px 12px;font-size:.78rem;margin:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.25s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.12)}
.card .top{height:90px;display:flex;align-items:flex-end;padding:12px 16px;color:#fff;font-family:'Amiri',serif;font-size:1.3rem;background:linear-gradient(135deg,var(--c),#0a1f1b)}
.card .bd{padding:16px}
.card small{color:var(--mute)}
#map{height:480px;border-radius:16px;border:1px solid var(--line);z-index:1}
.glos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.glos div{background:var(--card);border-left:4px solid var(--gold);padding:12px 16px;border-radius:8px}
.refs{columns:2 340px;gap:30px;font-size:.9rem}
.refs li{margin-bottom:8px;break-inside:avoid;list-style:none;padding-left:14px;border-left:2px solid var(--line)}
.note{background:var(--bg2);border-radius:12px;padding:16px 20px;margin-top:22px;font-size:.88rem;color:var(--mute)}
footer{background:#061513;color:#b8c4bf;text-align:center;padding:36px 20px;font-size:.9rem}
.hide{display:none!important}
</style>
</head>
