.sub{color:var(--mute);margin-bottom:30px}

.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.stat b{display:block;font-size:2.1rem;color:var(--gold);font-family:'Amiri',serif}
.rail{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 18px}
.rail button{flex:1 0 auto;min-width:120px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:inherit;font-size:.85rem;border-top:4px solid var(--c)}
.rail button.on{background:var(--c);color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;min-height:190px}
.panel h3{font-family:'Amiri','Noto Serif Bengali',serif;font-size:1.6rem;color:var(--gold)}
.panel .meta{color:var(--mute);font-size:.88rem;margin:4px 0 12px}
.tag{display:inline-block;background:var(--bg2);border-radius:20px;padding:2px 12px;font-size:.78rem;margin:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.25s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.12)}
.card .top{height:90px;display:flex;align-items:flex-end;padding:12px 16px;color:#fff;font-family:'Amiri',serif;font-size:1.3rem;background:linear-gradient(135deg,var(--c),#0a1f1b)}
.card .bd{padding:16px}
.card small{color:var(--mute)}
#map{height:480px;border-radius:16px;border:1px solid var(--line);z-index:1}
.glos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.glos div{background:var(--card);border-left:4px solid var(--gold);padding:12px 16px;border-radius:8px}
.refs{columns:2 340px;gap:30px;font-size:.9rem}
.refs li{margin-bottom:8px;break-inside:avoid;list-style:none;padding-left:14px;border-left:2px solid var(--line)}
.note{background:var(--bg2);border-radius:12px;padding:16px 20px;margin-top:22px;font-size:.88rem;color:var(--mute)}
footer{background:#061513;color:#b8c4bf;text-align:center;padding:36px 20px;font-size:.9rem}
.hide{display:none!important}

/* ===== লজিক ===== */
let lang=localStorage.lang||"bn",era=0;
const $=s=>document.querySelector(s);
function render(){
 const t=T[lang];document.body.dataset.lang=lang;document.documentElement.lang=lang;
 document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t[e.dataset.i18n]||"");
 document.querySelectorAll("[data-i18n-ph]").forEach(e=>e.placeholder=t[e.dataset.i18nPh]);
 $("#rail").innerHTML=t.eras.map((e,i)=>`<button style="--c:${COL[i]}" class="${i==era?'on':''}" onclick="era=${i};render()">${e[0]}</button>`).join("");
 const e=t.eras[era];
 const ART={1:[["seerah.html","সীরাত সেকশন — সব আর্টিকেল","Seerah section — all articles"],["badr.html","বদরের যুদ্ধ","The Battle of Badr"],["seerah-birth.html","মক্কা, বংশ ও জন্ম","Mecca, Lineage and Birth"],["seerah-khadija.html","যৌবন, খাদিজা (রা.) ও কাবা পুনর্নির্মাণ","Youth, Khadija (r.a.) and the Rebuilding of the Kaaba"]]};
 const arts=(ART[era]||[]).map(a=>`<a class="btn" style="background:var(--green);color:#fff;margin:4px 6px 0 0;padding:8px 18px;font-size:.9rem" href="${a[0]}">📖 ${lang==="bn"?a[1]:a[2]} →</a>`).join("");
 $("#panel").innerHTML=`<h3>${e[0]}</h3><div class="meta">${e[1]} · ${e[2]}</div><p>${e[3]}</p><div style="margin-top:12px">${e[4].map(x=>`<span class="tag">${x}</span>`).join("")}</div>${arts?`<div style="margin-top:14px"><b style="color:var(--gold)">${lang==="bn"?"এই যুগের আর্টিকেল":"Articles for this era"}</b><br>${arts}</div>`:""}`;
 $("#cards").innerHTML=t.eras.map((e,i)=>`<div class="card" data-s="${(e[0]+e[3]+e[4].join(' ')).toLowerCase()}" style="--c:${COL[i]}"><div class="top">${e[0]}</div><div class="bd"><small>${e[1]} · ${e[2]}</small><p style="margin-top:6px">${e[3]}</p></div></div>`).join("");
 $("#glos").innerHTML=t.glos.map(g=>`<div><b>${g[0]}</b><br>${g[1]}</div>`).join("");
 $("#reflist").innerHTML=SOURCES.map(s=>`<li>${s}</li>`).join("");
 $("#schcats").innerHTML=SCH_CATS.map(c=>`<a style="--c:${c[2]}" href="scholars.html">${lang==="bn"?c[0]:c[1]}</a>`).join("");
 $("#lang").value=lang;
}
const SCH_CATS=[["সাহাবি ও তাবেঈ","Companions & Successors","#8a5a2b"],["চার মাজহাব","Four Schools","#0f5a4a"],["হাদিসশাস্ত্র","Hadith","#6b3fa0"],["তাফসির","Tafsir","#c0662b"],["আকিদা ও কালাম","Theology","#3a6d8a"],["দর্শন ও বিজ্ঞান","Philosophy & Science","#2b8a6a"],["ইতিহাসবিদ","Historians","#8a2b4f"],["তাসাউফ","Tasawwuf","#5f7a2b"],["উপমহাদেশ ও আধুনিক","Subcontinent & Modern","#2b5f8a"],["বাংলাদেশের আলেম","Scholars of Bangladesh","#1f7a4a"]];
$("#lang").onchange=e=>{lang=e.target.value;localStorage.lang=lang;render()};
$("#dark").onclick=()=>{const d=document.documentElement;const on=d.dataset.theme==="dark";d.dataset.theme=on?"":"dark";localStorage.theme=on?"":"dark"};
if(localStorage.theme)document.documentElement.dataset.theme=localStorage.theme;
let fs=17;$("#fplus").onclick=()=>{fs=Math.min(24,fs+1);document.documentElement.style.setProperty("--fs",fs+"px")};
$("#fminus").onclick=()=>{fs=Math.max(13,fs-1);document.documentElement.style.setProperty("--fs",fs+"px")};
$("#q").oninput=e=>{const v=e.target.value.toLowerCase();document.querySelectorAll(".card").forEach(c=>c.classList.toggle("hide",v&&!c.dataset.s.includes(v)));if(v)location.hash="#volumes"};
render();
/* কাউন্টার অ্যানিমেশন */
document.querySelectorAll("[data-count]").forEach(el=>{const n=+el.dataset.count;let c=0;const step=Math.max(1,Math.ceil(n/60));const id=setInterval(()=>{c=Math.min(n,c+step);el.textContent=c;if(c>=n)clearInterval(id)},25)});
/* মানচিত্র */
try{const m=L.map("map",{scrollWheelZoom:false}).setView([32,40],4);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap contributors"}).addTo(m);
CITIES.forEach(c=>L.marker([c[1],c[2]]).addTo(m).bindPopup(`<b>${c[0]}</b><br>${c[3]}`));}catch(e){}
</script>
