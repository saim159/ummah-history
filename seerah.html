  <h2 id="src">${u.s_src}</h2><ul class="bib">${SRCS.map(s=>`<li><span class="tag t-${s[0]}">${L(TYPE[s[0]])}</span>${L(s[1])}<em>${L(s[2])}</em></li>`).join("")}</ul>
  <div class="note">${u.srcnote}</div>
 </article></div>
 <footer>© 2026 Ummah Chronicles</footer>`;
 $("#lang").value=lang;
 $("#lang").onchange=e=>{lang=e.target.value;store.set("lang",lang);render()};
 $("#dark").onclick=()=>{const d=document.documentElement,on=d.dataset.theme==="dark";d.dataset.theme=on?"":"dark";store.set("theme",on?"":"dark")};
 let fs=parseInt(getComputedStyle(document.documentElement).getPropertyValue("--fs"))||17;
 $("#fplus").onclick=()=>{fs=Math.min(24,fs+1);document.documentElement.style.setProperty("--fs",fs+"px")};
 $("#fminus").onclick=()=>{fs=Math.max(13,fs-1);document.documentElement.style.setProperty("--fs",fs+"px")};
 try{const m=L2.map("map",{scrollWheelZoom:false}).setView([24,38.5],6);
  L2.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap contributors"}).addTo(m);
  PTS.forEach(p=>L2.marker([p[0],p[1]]).addTo(m).bindPopup(`<b>${L(p[2])}</b><br>${L(p[3])}`));
  LNS.forEach(l=>L2.polyline(l.pts,{color:l.c,weight:3,dashArray:"6 8"}).addTo(m).bindTooltip(L(l.n)));}catch(e){}
}
window.addEventListener("scroll",()=>{const h=document.documentElement;$("#prog").style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+"%"});
</script>
<script>var L2=window.L;</script>
<script>render();</script>
</body>
</html>
