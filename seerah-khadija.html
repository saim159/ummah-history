   {t:"p",bn:"নবুয়তের আগের জীবনে মুহাম্মদ ﷺ মক্কার সমাজে সততা ও বিশ্বস্ততার জন্য পরিচিত ছিলেন; সূত্রগুলোতে তিনি 'আল-আমীন' উপাধিতে উল্লিখিত। তিনি ব্যবসায় যুক্ত হন, খাদিজা (রা.)-কে বিয়ে করেন এবং মক্কার সামাজিক কয়েকটি ঘটনায় অংশ নেন।{ish|কাবা পুনর্নির্মাণ ও হাজারে আসওয়াদের মীমাংসা}{watt|Muhammad at Mecca, নবুয়তের আগের জীবন}",en:"Before prophethood, Muhammad ﷺ was known in Meccan society for honesty and trustworthiness; the sources call him 'al-Amin'. He took part in trade, married Khadija (r.a.) and was involved in several social events in Mecca.{ish|Rebuilding of the Kaaba and the Black Stone settlement}{watt|Muhammad at Mecca, life before prophethood}"},

   {t:"p",bn:"আবু তালিবের তত্ত্বাবধানে বড় হওয়া তরুণ মুহাম্মদ ﷺ মক্কার সমাজের রীতি অনুযায়ী পরিশ্রম ও বাণিজ্যে নিযুক্ত হন। সূত্রে মেষচারণের কথাও এসেছে।{ish|যৌবনের ঘটনাবলি}{bukh|কিতাবুল ইজারাহ — মেষচারণ}",en:"Raised under Abu Talib's care, the young Muhammad ﷺ took up labour and trade in line with Meccan custom. The sources also mention shepherding.{ish|Events of his youth}{bukh|Kitab al-Ijara — shepherding}"},
   {t:"p",bn:"কুরাইশ ও তাদের মিত্ররা কায়স গোত্রের বিরুদ্ধে 'হারবুল ফিজার'-এ জড়ায় — পবিত্র মাসের মর্যাদা লঙ্ঘনের কারণে এই নাম। নবী ﷺ তখন তরুণ ছিলেন এবং এতে তাঁর ভূমিকা সীমিত ছিল বলে বর্ণিত।{ish|ফিজারের যুদ্ধ}",en:"The Quraysh and their allies became involved in the 'Harb al-Fijar' against Qays — named for the violation of the sacred months. He was a young man and his role is reported to have been limited.{ish|The Fijar war}"},
   {t:"p",bn:"এর পরে 'হিলফুল ফুজুল' সম্পাদিত হয়: মক্কার কয়েকটি বংশ আবদুল্লাহ ইবনে জুদআনের ঘরে সমবেত হয়ে অঙ্গীকার করে যে মক্কায় কেউ অত্যাচারিত হলে তারা তার পাশে দাঁড়াবে। নবী ﷺ পরে এই চুক্তির প্রশংসা করেছেন বলে বর্ণিত।{ish|হিলফুল ফুজুল}",en:"Afterwards the 'Hilf al-Fudul' was concluded: several Meccan clans met in the house of Abdullah ibn Jud'an and pledged to stand with anyone wronged in Mecca. The Prophet ﷺ is reported to have praised this pact later.{ish|Hilf al-Fudul}"}

  {id:"khadija",h:{bn:"খাদিজা (রা.)-এর সঙ্গে বিবাহ",en:"Marriage to Khadija (r.a.)"},blocks:[
   {t:"p",bn:"খাদিজা বিনতে খুওয়াইলিদ ছিলেন কুরাইশের একজন সম্মানিত ও ধনী ব্যবসায়ী নারী। তিনি বিশ্বস্ত ব্যক্তিদের মাধ্যমে নিজের বাণিজ্য-পণ্য পরিচালনা করাতেন।{ish|খাদিজা (রা.)-এর সঙ্গে বিবাহ}{sad|খাদিজা বিনতে খুওয়াইলিদ}",en:"Khadija bint Khuwaylid was a respected and wealthy merchant woman of the Quraysh. She had her trade goods managed through trusted agents.{ish|Marriage to Khadija (r.a.)}{sad|Khadija bint Khuwaylid}"},
   {t:"p",bn:"নবী ﷺ-এর সততার খ্যাতি শুনে তিনি তাঁকে সিরিয়ায় তাঁর কাফেলা নিয়ে যেতে প্রস্তাব দেন। সফর থেকে ফিরে এলে তাঁর সততা ও দক্ষতায় মুগ্ধ হয়ে তিনি বিবাহের প্রস্তাব পাঠান; আবু তালিব ও পরিবারের উপস্থিতিতে বিবাহ সম্পন্ন হয়।{ish|খাদিজা (রা.)-এর সঙ্গে বিবাহ}",en:"Hearing of his honesty, she proposed that he take her caravan to Syria. When he returned, impressed by his integrity and skill, she sent a marriage proposal; the marriage took place in the presence of Abu Talib and the family.{ish|Marriage to Khadija (r.a.)}"},
   {t:"p",bn:"এই বিবাহে ছয় সন্তান জন্মায়: দুই পুত্র (কাসিম ও আবদুল্লাহ) শৈশবেই ইন্তেকাল করেন; চার কন্যা — যয়নব, রুকাইয়া, উম্মে কুলসুম ও ফাতিমা (রা.)।{sad|নবী ﷺ-এর সন্তানগণ}",en:"Six children were born of this marriage: two sons (Qasim and Abdullah) who died in infancy, and four daughters — Zaynab, Ruqayya, Umm Kulthum and Fatima (r.a.).{sad|Children of the Prophet ﷺ}"},
   {t:"p",bn:"খাদিজা (রা.) আজীবন নবী ﷺ-এর পাশে ছিলেন এবং প্রথম ঈমান-আনয়নকারীদের একজন হিসেবে পরিচিত — এটি পরের আর্টিকেলে আসবে।{ish|প্রথম ঈমান-আনয়নকারীগণ}",en:"Khadija (r.a.) stayed at his side throughout her life and is known as one of the first believers — this comes in the next article.{ish|The first believers}"},

  {id:"kaaba",h:{bn:"কাবার পুনর্নির্মাণ",en:"Rebuilding the Kaaba"},blocks:[
   {t:"p",bn:"নবুয়তের কয়েক বছর আগে কাবা-ঘর জীর্ণ হয়ে পড়ে এবং বন্যার ক্ষতির ঝুঁকিতে ছিল; কুরাইশরা তা নতুন করে নির্মাণের সিদ্ধান্ত নেয়।{ish|কাবা পুনর্নির্মাণ ও হাজারে আসওয়াদের মীমাংসা}",en:"A few years before prophethood the Kaaba had become worn and was exposed to flood damage; the Quraysh decided to rebuild it.{ish|Rebuilding of the Kaaba and the Black Stone settlement}"},
   {t:"p",bn:"নির্মাণ প্রায় শেষ হলে হাজারে আসওয়াদ যথাস্থানে কে বসাবে তা নিয়ে গোত্রগুলোর মধ্যে তীব্র বিরোধ হয়। শেষে ঠিক হয়, পরদিন সকালে যে প্রথম প্রবেশ করবে সে-ই মীমাংসা করবে; প্রবেশকারী ছিলেন মুহাম্মদ ﷺ।{ish|কাবা পুনর্নির্মাণ ও হাজারে আসওয়াদের মীমাংসা}",en:"When the walls were nearly done, the clans fell into sharp dispute over who would set the Black Stone in place. It was agreed that the first person to enter the next morning would decide; the one who entered was Muhammad ﷺ.{ish|Rebuilding of the Kaaba and the Black Stone settlement}"},
   {t:"p",bn:"বর্ণনা অনুযায়ী তিনি একটি চাদর বিছিয়ে তাতে পাথরটি রাখেন এবং প্রতিটি গোত্রের প্রতিনিধিকে চাদরের কিনারা ধরে তুলতে বলেন; পরে নিজ হাতে পাথরটি যথাস্থানে স্থাপন করেন। এভাবে রক্তপাত এড়ানো যায়।{ish|কাবা পুনর্নির্মাণ ও হাজারে আসওয়াদের মীমাংসা}{lings|Muhammad, কাবা পুনর্নির্মাণ}",en:"As reported, he spread a cloak, placed the stone on it and asked a representative of each clan to hold an edge and lift; he then set the stone in place with his own hands. Bloodshed was thus avoided.{ish|Rebuilding of the Kaaba and the Black Stone settlement}{lings|Muhammad, rebuilding of the Kaaba}"},
   {t:"p",bn:"সম্পদের অভাবে কুরাইশরা কাবার একটি অংশ (হিজর) ভেতরে না এনে বাইরে রেখে দেয় বলে বর্ণিত।{ish|কাবা পুনর্নির্মাণ ও হাজারে আসওয়াদের মীমাংসা}",en:"For lack of funds the Quraysh are reported to have left a part (the Hijr) outside the rebuilt walls.{ish|Rebuilding of the Kaaba and the Black Stone settlement}"},
   {t:"fig",bn:"এখানে কাবা বা মাসজিদুল হারামের যাচাই-করা Wikimedia Commons ছবি (লাইসেন্স ও ক্রেডিটসহ) বসবে। নবী ﷺ বা সাহাবিদের কোনো চিত্র ব্যবহার করা হবে না।",en:"A verified Wikimedia Commons photograph of the Kaaba or al-Masjid al-Haram (with licence and credit) will go here. No depiction of the Prophet ﷺ or the Companions is used."}
  ]},

  {id:"significance",h:{bn:"তাৎপর্য",en:"Significance"},blocks:[
   {t:"p",bn:"এই পর্ব দেখায় যে ওহী আসার আগেই নবী ﷺ মক্কার সমাজে বিশ্বস্ত ও সালিশকারী হিসেবে স্বীকৃত ছিলেন; পরের দাওয়াতি জীবনে খাদিজা (রা.)-এর সমর্থন ও আবু তালিবের আশ্রয় এর সঙ্গে সম্পর্কিত।{watt|Muhammad at Mecca, নবুয়তের আগের জীবন}{ei2|'Muhammad' এন্ট্রি}",en:"This period shows that before revelation the Prophet ﷺ was already recognised in Meccan society as trustworthy and as an arbiter; the later support of Khadija (r.a.) and the protection of Abu Talib are connected to this.{watt|Muhammad at Mecca, life before prophethood}{ei2|Entry 'Muhammad'}"},
   {t:"p",bn:"পরবর্তী আর্টিকেল: ওহী ও গোপন দাওয়াত।",en:"Next article: Revelation and the Secret Call."}
  ]},

   {t:"var",h:{bn:"কাবা পুনর্নির্মাণের সময়:",en:"Time of the rebuilding:"},bn:"সাধারণত নবী ﷺ-এর বয়স আনু. ৩৫ ধরা হয় (আনু. ৬০৫ খ্রি.); কোনো বর্ণনায় ভিন্ন বয়স আছে। কাবার পাথর বসানোর খুঁটিনাটি বর্ণনায় সূত্রভেদ আছে।",en:"His age is usually given as about 35 (c. 605 CE); some reports differ. Details of the Black Stone episode vary between sources."},
