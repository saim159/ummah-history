   {t:"p",bn:"কুরাইশের প্রভাবশালী গোত্র-শাখাগুলোর একটি ছিল বনু হাশিম; কাবার হাজিদের পানি পান করানোর দায়িত্ব (সিকায়া) ছিল আবদুল মুত্তালিবের হাতে।{ish|আবদুল মুত্তালিব ও যমযম}",en:"The Banu Hashim were among the notable branches of the Quraysh; Abd al-Muttalib held the duty of providing water to pilgrims at the Kaaba (siqaya).{ish|Abd al-Muttalib and Zamzam}"},

   {t:"p",bn:"আরবের রীতি অনুযায়ী শিশুকে দুধপান ও লালনের জন্য মরু-গোত্রে পাঠানো হতো। নবী ﷺ বনু সা'দ গোত্রের হালিমার কাছে কয়েক বছর কাটান।{ish|দুধপান ও বনু সা'দে শৈশব}",en:"By Arab custom infants were sent to desert tribes to be nursed and raised. The Prophet ﷺ spent some years with Halima of the Banu Sa'd.{ish|Fostering among the Banu Sa'd}"},
   {t:"p",bn:"আনুমানিক ছয় বছর বয়সে মা আমিনা তাঁকে নিয়ে মদিনা সফর করেন; ফেরার পথে আল-আবওয়ায় আমিনা ইন্তেকাল করেন।{ish|আমিনার মৃত্যু}{sad|নবী ﷺ-এর পিতা-মাতা}",en:"At about the age of six his mother Amina took him on a journey to Medina; on the way back she died at al-Abwa'.{ish|Death of Amina}{sad|The Prophet's parents}"},
   {t:"p",bn:"এরপর দাদা আবদুল মুত্তালিব তাঁর অভিভাবক হন; তিনিও আনুমানিক দুই বছর পর ইন্তেকাল করলে চাচা আবু তালিব দায়িত্ব নেন। কুরআনে এই এতিম-অবস্থা ও আল্লাহর আশ্রয়ের স্মরণ আছে।{ish|আবদুল মুত্তালিবের মৃত্যু}{quran|৯৩:৬–৮}",en:"His grandfather Abd al-Muttalib then became his guardian; when he too died about two years later, his uncle Abu Talib took charge. The Qur'an recalls this state of orphanhood and God's shelter.{ish|Death of Abd al-Muttalib}{quran|93:6–8}"},
   {t:"p",bn:"আনুমানিক ১২ বছর বয়সে আবু তালিবের সঙ্গে সিরিয়া-অভিমুখে বাণিজ্য-কাফেলায় যান। এই সফরের সঙ্গে জড়িত বুহাইরা-পাদ্রির কাহিনি সীরাত-সূত্রে আছে; ঐতিহাসিকেরা এর বিস্তারিত অংশ নিয়ে আলোচনা করেছেন।{ish|আবু তালিবের সঙ্গে সিরিয়া-সফর}",en:"At about twelve he travelled with Abu Talib in a trade caravan toward Syria. The story of the monk Bahira linked to this journey is in the Sira sources; historians have discussed its details.{ish|The journey to Syria with Abu Talib}"},
   {t:"fig",bn:"এখানে মক্কা বা কাবা-অঞ্চলের একটি যাচাই-করা Wikimedia Commons ছবি (লাইসেন্স ও ক্রেডিটসহ) বসবে। নবী ﷺ বা সাহাবিদের কোনো চিত্র ব্যবহার করা হবে না।",en:"A verified Wikimedia Commons photograph of Mecca or the Kaaba area (with licence and credit) will go here. No depiction of the Prophet ﷺ or the Companions is used."}
  ]},

  {id:"significance",h:{bn:"তাৎপর্য",en:"Significance"},blocks:[
   {t:"p",bn:"এই বছরগুলো পরবর্তী নবুয়তি জীবনের প্রেক্ষাপট: কুরাইশ সমাজ, বনু হাশিমের মর্যাদা এবং আবু তালিবের আশ্রয় — যা মাক্কী পর্বের বহু ঘটনা বুঝতে সাহায্য করে।{watt|Muhammad at Mecca, মক্কী সমাজ}{ei2|'Muhammad' এন্ট্রি}",en:"These years form the backdrop to the later prophetic life: Quraysh society, the standing of the Banu Hashim and the protection of Abu Talib, which help explain many events of the Meccan period.{watt|Muhammad at Mecca, Meccan society}{ei2|Entry 'Muhammad'}"},
   {t:"p",bn:"পরবর্তী আর্টিকেল: যৌবন, খাদিজা (রা.)-এর সঙ্গে বিবাহ ও কাবার পুনর্নির্মাণ।",en:"Next article: youth, marriage to Khadija (r.a.) and the rebuilding of the Kaaba."}
  ]},

   {t:"var",h:{bn:"জন্মসাল:",en:"Birth year:"},bn:"আনু. ৫৭০ বা ৫৭১ খ্রিষ্টাব্দ; আধুনিক গবেষকেরা সঠিক সাল নিয়ে সতর্ক এবং আরবীয় বর্ষপঞ্জির সীমাবদ্ধতার কথা উল্লেখ করেন।",en:"c. 570 or 571 CE; modern scholars are cautious about the exact year, noting the limits of the pre-Islamic Arabian calendar."},
   {t:"var",h:{bn:"পিতার মৃত্যুর সময়:",en:"Timing of the father's death:"},bn:"জন্মের আগে (বহুল প্রচলিত) বা অল্প পরে — সূত্রভেদে ভিন্ন।",en:"Before the birth (widely reported) or shortly after — sources differ."},
   {t:"var",h:{bn:"বুহাইরার কাহিনি:",en:"The Bahira story:"},bn:"সীরাত-সূত্রে বর্ণিত; এর বর্ণনাধারা ও বিস্তারিত অংশ নিয়ে মুহাদ্দিস ও ঐতিহাসিকদের মধ্যে আলোচনা আছে।",en:"Reported in the Sira sources; its chains of transmission and details have been discussed by hadith scholars and historians."},
   {t:"var",h:{bn:"সূত্রের প্রকৃতি:",en:"Nature of the sources:"},bn:"শৈশবের তথ্য মূলত ইবনে ইসহাক-ইবনে হিশাম ও ইবনে সা'দের ওপর নির্ভরশীল; সমসাময়িক লিখিত সূত্র নেই, তাই আধুনিক গবেষকেরা এই অংশে সতর্কতার সঙ্গে সিদ্ধান্ত টানেন।",en:"Information on childhood rests mainly on Ibn Ishaq–Ibn Hisham and Ibn Sa'd; there are no contemporary written sources, so modern scholars draw conclusions here with caution."},
